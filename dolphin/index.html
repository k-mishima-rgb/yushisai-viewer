<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061f37">
  <title>勇志イルカ投票（見るだけ）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #eefaff;
      --muted: rgba(223,244,255,.7);
      --panel: rgba(5,25,44,.68);
      --line: rgba(174,228,255,.2);
      --blue: #70d8ff;
      --pink: #ff8fd0;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,.35), transparent 38%),
        radial-gradient(circle at 15% 0%, rgba(255,255,255,.22), transparent 30%),
        linear-gradient(160deg, #c9f2ff 0%, #7fd8f5 46%, #3fb4e0 100%);
    }
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; mix-blend-mode: screen;
      background: conic-gradient(from 200deg at 50% -12%, rgba(170,232,255,.22), transparent 32%);
    }
    .bg-waves {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .4;
      background-image: repeating-linear-gradient(115deg, rgba(180,230,255,.06) 0px, rgba(180,230,255,.06) 2px, transparent 2px, transparent 64px);
      animation: waveShift 16s linear infinite;
    }
    @keyframes waveShift {
      from { background-position: 0 0; }
      to { background-position: 420px 210px; }
    }
    .bg-title {
      position: fixed; inset: 0; z-index: 1; display: flex; align-items: flex-start; justify-content: center;
      padding-top: 9vh; pointer-events: none; text-align: center;
      font-family: "Hachi Maru Pop", "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: clamp(30px, 6.5vw, 68px); font-weight: 400; letter-spacing: .02em;
      white-space: nowrap;
    }
    .bg-title span {
      display: inline-block;
      -webkit-text-stroke: 3px rgba(255,255,255,.92);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow:
        0 3px 0 rgba(255,255,255,.55),
        0 10px 0 rgba(4,60,90,.16),
        0 16px 26px rgba(4,60,90,.24);
      animation: balloonBob 3.2s ease-in-out infinite;
    }
    /* 黄・赤・青・ピンクの4色をバルーンの1文字ずつ順番に割り当て、それぞれ光沢のハイライトを乗せる */
    .bg-title span:nth-child(4n+1) { background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.95), rgba(255,255,255,0) 44%), #ffd23f; animation-delay: 0s; }
    .bg-title span:nth-child(4n+2) { background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.95), rgba(255,255,255,0) 44%), #ff5c5c; animation-delay: .3s; }
    .bg-title span:nth-child(4n+3) { background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.95), rgba(255,255,255,0) 44%), #4d94ff; animation-delay: .6s; }
    .bg-title span:nth-child(4n)   { background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.95), rgba(255,255,255,0) 44%), #ff8fd0; animation-delay: .9s; }
    @keyframes balloonBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-11px) rotate(-3deg); }
    }
    .bubbles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .bubble {
      position: absolute; bottom: -8%; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.7), rgba(190,235,255,.15) 60%, transparent 76%);
      animation-name: bubbleRise; animation-timing-function: ease-in; animation-iteration-count: infinite;
    }
    @keyframes bubbleRise {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      12% { opacity: .85; }
      88% { opacity: .5; }
      100% { transform: translateY(-115vh) translateX(var(--drift, 24px)); opacity: 0; }
    }

    .clouds { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .cloud {
      position: absolute; width: 90px; height: 34px; border-radius: 40px;
      background: rgba(255,255,255,.82);
      box-shadow:
        -34px 7px 0 -6px rgba(255,255,255,.78),
        32px 5px 0 -8px rgba(255,255,255,.78),
        8px -14px 0 -10px rgba(255,255,255,.7);
      filter: blur(.4px);
      animation-name: cloudDrift; animation-timing-function: linear; animation-iteration-count: infinite;
    }
    @keyframes cloudDrift {
      from { transform: translateX(-20vw) scale(var(--cloud-scale, 1)); }
      to { transform: translateX(120vw) scale(var(--cloud-scale, 1)); }
    }

    .gulls { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .gull { position: absolute; width: 22px; height: 10px; animation-name: gullFly; animation-timing-function: linear; animation-iteration-count: infinite; }
    .gull svg { width: 100%; height: 100%; display: block; animation: gullFlap .7s ease-in-out infinite; transform-origin: center; }
    @keyframes gullFlap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(.55); }
    }
    @keyframes gullFly {
      from { transform: translateX(-8vw) translateY(0); }
      50% { transform: translateX(56vw) translateY(-18px); }
      to { transform: translateX(120vw) translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-waves, .bubble, .bg-title span, .cloud, .gull, .gull svg { animation: none; }
    }
    #stage { position: fixed; inset: 0; z-index: 2; width: 100%; height: 100%; display: block; }

    .topbar {
      position: fixed; z-index: 3; inset: auto 0 max(14px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      pointer-events: none;
    }
    .score-row {
      display: flex; justify-content: center; align-items: center; gap: 1.6vw;
    }
    .timer {
      font-size: 12px; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums;
      padding: 5px 14px; border: 1px solid var(--line); border-radius: 999px;
      background: rgba(3,17,31,.34); backdrop-filter: blur(14px);
    }
    .timer.is-over { color: var(--pink); }
    .score {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      width: clamp(84px, 11vw, 130px); min-height: 64px;
      padding: 6px 8px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--panel); backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
    }
    .score .label {
      font-size: 10px; letter-spacing: .04em; color: var(--muted);
      white-space: normal; text-align: center; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .score .count { font-size: clamp(20px, 2.4vw, 32px); line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
    .score .label, .score .count { color: var(--score-color, var(--ink)); }
    .score .count { text-shadow: 0 0 24px var(--score-glow, transparent); }
    @media (max-width: 720px) {
      .score { width: clamp(66px, 20vw, 96px); min-height: 56px; }
      .score .count { font-size: clamp(18px, 5vw, 26px); }
      .score .label { font-size: 8px; }
      .score-row { gap: 1.2vw; }
    }

    .goal-btn {
      position: fixed; z-index: 4; right: max(6px, env(safe-area-inset-right)); top: max(6px, env(safe-area-inset-top));
      width: 12px; height: 12px; padding: 0; border: none; border-radius: 50%;
      background: rgba(255,255,255,.22); cursor: pointer;
    }
    .goal-btn:hover { background: rgba(255,255,255,.4); }
    /* ファイナルレース操作用の極小ボタン（H=隠す/表示、G長押し=レース開始と同じ働き） */
    .goal-btn.hide-btn { right: calc(max(6px, env(safe-area-inset-right)) + 20px); }
    .goal-btn.race-btn { right: calc(max(6px, env(safe-area-inset-right)) + 42px); }
    .goal-btn.is-holding { background: rgba(255,255,255,.75); }
    /* 操作キーの文字を点の中に小さく表示する（観客には目立たない薄さ） */
    .goal-btn.key-btn {
      width: 16px; height: 16px; top: calc(max(6px, env(safe-area-inset-top)) - 2px);
      font: 700 10px/16px -apple-system, BlinkMacSystemFont, sans-serif; color: rgba(255,255,255,.75); text-align: center;
    }
    .goal-btn.key-btn.is-holding { color: #061f37; }

    /* ファイナルレースの大きな告知（ラストスパート投票中／カウントダウン／優勝） */
    .finale-banner {
      position: fixed; z-index: 5; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9);
      max-width: calc(100vw - 32px); padding: .2em .7em; border-radius: 999px; text-align: center;
      font-family: "Hachi Maru Pop", "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: clamp(28px, 5.4vw, 64px); line-height: 1.25; color: #fff;
      background: rgba(6,31,55,.72);
      text-shadow: 0 4px 0 rgba(6,31,55,.45);
      white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s ease, transform .25s ease;
    }
    .finale-banner.is-visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .finale-banner.is-small { top: auto; bottom: clamp(132px, 24vh, 180px); transform: translate(-50%, 0); font-size: clamp(18px, 2.6vw, 30px); }
    /* 結果発表はゴール付近（画面下）にイルカがいるので、上側に出す */
    .finale-banner.is-top { top: 30%; font-size: clamp(22px, 3.6vw, 44px); }
    .finale-banner.is-countdown { font-size: clamp(56px, 12vw, 150px); background: transparent; text-shadow: 0 6px 0 rgba(6,31,55,.55), 0 0 30px rgba(6,31,55,.5); }

    .status { position: fixed; z-index: 4; left: 16px; bottom: 16px; font-size: 11px; color: var(--muted); padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(3,17,31,.34); }

    .speech-bubble {
      position: fixed; z-index: 6; left: 0; top: 0; transform: translate(-50%, calc(-100% - 14px));
      width: max-content; max-width: min(220px, calc(100vw - 32px)); padding: 8px 12px; border-radius: 14px;
      background: #fff; color: #123047; font-size: 13px; font-weight: 700;
      text-align: center; line-height: 1.3; box-shadow: 0 6px 18px rgba(0,0,0,.25);
      pointer-events: none; opacity: 0; transition: opacity .25s ease; white-space: normal; word-break: break-word;
    }
    .speech-bubble::after {
      content: ''; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
      border-width: 8px 7px 0 7px; border-style: solid; border-color: #fff transparent transparent transparent;
    }
    .speech-bubble.is-visible { opacity: 1; }
    .error { position: fixed; z-index: 8; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(560px,calc(100vw - 32px)); padding: 20px; border: 1px solid rgba(255,150,150,.3); border-radius: 16px; background: rgba(45,8,16,.9); display: none; }
    .error.is-visible { display: block; }
    .is-viewer .goal-btn, .is-viewer .timer { display: none; }
    /* 生徒のスマホ（縦持ち）: 4枚の得票カードを画面幅に収め、状態表示はカードと重ならない上に置く */
    .is-viewer .status { bottom: auto; top: max(8px, env(safe-area-inset-top)); }
    @media (max-width: 720px) {
      .is-viewer .score-row { width: 100vw; padding: 0 16px; gap: 6px; box-sizing: border-box; }
      .is-viewer .score { flex: 1 1 0; width: auto; min-width: 0; }
    }
  </style>
  <script src="viewer-config.js"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-waves"></div>
  <div class="bg-title"><span>勇</span><span>志</span><span>イ</span><span>ル</span><span>カ</span><span>レ</span><span>ー</span><span>ス</span></div>
  <div class="bubbles" id="bubbles"></div>
  <div class="clouds" id="clouds"></div>
  <div class="gulls" id="gulls"></div>
  <canvas id="stage" aria-label="勇志イルカ投票モニター"></canvas>

  <header class="topbar">
    <div class="score-row">
      <div class="score" id="score-blue_logo">
        <div class="label" id="label-blue_logo"></div>
        <div class="count" id="count-blue_logo">0</div>
      </div>
      <div class="score" id="score-blue_manga">
        <div class="label" id="label-blue_manga"></div>
        <div class="count" id="count-blue_manga">0</div>
      </div>
      <div class="score" id="score-pink_logo">
        <div class="label" id="label-pink_logo"></div>
        <div class="count" id="count-pink_logo">0</div>
      </div>
      <div class="score" id="score-pink_manga">
        <div class="label" id="label-pink_manga"></div>
        <div class="count" id="count-pink_manga">0</div>
      </div>
    </div>
    <div class="timer" id="timer">投票終了まで --:--:--</div>
  </header>
  <div class="finale-banner" id="finale-banner" aria-live="polite"></div>

  <div class="status" id="status">集計待機中…</div>
  <div class="speech-bubble" id="speech-bubble"></div>
  <div class="error" id="error" role="alert"></div>

  <script defer src="app.js"></script>
</body>
</html>
