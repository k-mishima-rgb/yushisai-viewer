<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>勇志祭 見るだけページ</title>
  <style>
    :root { --ink: #1A1A1A; --sub: #4D4D4D; --line: #CCCCCC; --bg: #F2F2F2; --blue: #0066BE; --green: #197A4B; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; display: grid; place-items: center; padding: 24px 16px; }
    main { width: min(480px, 100%); }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { margin: 0 0 20px; color: var(--sub); font-size: 14px; line-height: 1.6; }
    a { display: block; padding: 20px; margin-bottom: 12px; border-radius: 14px; color: #fff; text-decoration: none;
      font-size: 18px; font-weight: 700; }
    a small { display: block; font-size: 13px; font-weight: 400; margin-top: 4px; }
    .dolphin { background: var(--blue); }
    .tree { background: var(--green); }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>勇志祭 見るだけページ</h1>
    <p>配信と同じ画面を、自分の端末で見られます。操作はできません。</p>
    <a class="dolphin" href="dolphin/">イルカ人気投票<small>イルカの読み込みに少し時間がかかります（約26MB）</small></a>
    <a class="tree" href="tree/">メッセージツリー<small>付箋をタップすると全文が読めます</small></a>
  </main>
</body>
</html>
